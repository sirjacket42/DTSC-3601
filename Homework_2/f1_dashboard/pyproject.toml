[project]
name = "f1-dashboard"
version = "0.1.0"
description = "F1 2023-2026 results dashboard backed by Supabase, deployed on Modal"
readme = "README.md"
authors = [
    { name = "sirjacket42", email = "peyton@robinson-us.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "plotly>=6.9.0",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "supabase>=2.10.0",
]

[dependency-groups]
dev = ["modal>=0.68.0"]

[tool.uv]
package = false
