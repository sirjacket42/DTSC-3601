name: Sync races and results

on:
  schedule:
    # Every 15 minutes. GitHub may delay a run under load, but it's not
    # capped at 1/day the way Vercel Cron is on the Hobby plan.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/sync-races
        run: |
          curl -fsS "https://f1-dashboard-green.vercel.app/api/sync-races" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Hit /api/sync-results
        # Results only change once a race weekend actually finishes, but this is cheap
        # to poll — Jolpica just returns empty until a round is published, so re-running
        # every 15 minutes is what makes a race's points show up promptly afterward.
        run: |
          curl -fsS "https://f1-dashboard-green.vercel.app/api/sync-results" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
